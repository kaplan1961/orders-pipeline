# Runs the project's Definition of Done on every push and pull request:
# formatting, lint, strict typing, the full test suite against real PostgreSQL,
# and a check that the committed output table matches a fresh pipeline run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d orders_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/orders_test
      PIPELINE_TEST_DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/orders_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      # Runs on the empty database before the tests, so it is a true first load.
      - name: Output table matches a fresh run
        run: |
          uv run orders-pipeline --database-url "$DATABASE_URL" --data-dir data --out-dir fresh_out
          diff -u out/gold_daily_sales.csv fresh_out/gold_daily_sales.csv

      - name: Tests (PostgreSQL, coverage >= 90%)
        run: uv run pytest --cov=example_1 --cov-report=term-missing --cov-fail-under=90
